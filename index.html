<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#eceeea" />
    <meta name="description" content="Para Giovanna, na reta final da preparação para a residência em enfermagem." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet" />

    <title>Giovanna</title>

    <script>
      if ("scrollRestoration" in history) {
        history.scrollRestoration = "manual";
      }

      window.scrollTo(0, 0);

      window.addEventListener(
        "pageshow",
        () => {
          window.scrollTo({
            top: 0,
            left: 0,
            behavior: "instant",
          });
        },
        { once: true }
      );
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
